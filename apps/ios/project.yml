# The iPhone and iPad app. scripts/build-ios.sh builds the Rust core into
# Frameworks/BibleFFI.xcframework and Generated/BibleFFI.swift, then runs XcodeGen on this file
# to make Bible.xcodeproj; none of those three are checked in.
name: Bible
options:
  # Only a fallback: every target sets PRODUCT_BUNDLE_IDENTIFIER from $(BIBLE_BUNDLE_ID), which is
  # the single setting in Config/Bible.xcconfig. Kept in step with it so a stray default can't
  # produce an upstream-looking identifier.
  bundleIdPrefix: au.com.onyxit.lamplens.dev
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Bible.xcconfig
  Release: Config/Bible.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  Bible:
    type: application
    platform: iOS
    sources:
      - path: Bible
      - path: Generated/BibleFFI.swift
      # The reading voice ships inside the app, so Read Aloud needs no network and nothing can go
      # stale. Staged and checksummed by scripts/build-ios.sh before the project is generated.
      - path: Voice
        type: folder
        buildPhase: resources
      # The Mac app's fonts, shared rather than copied.
      - path: ../../crates/app/assets/fonts/Literata.ttf
        buildPhase: resources
        group: Fonts
      - path: ../../crates/app/assets/fonts/Literata-Italic.ttf
        buildPhase: resources
        group: Fonts
      - path: ../../crates/app/assets/fonts/Inter.ttf
        buildPhase: resources
        group: Fonts
    dependencies:
      - framework: Frameworks/BibleFFI.xcframework
        embed: false
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Lamplens
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        # Read Aloud keeps going with the screen off, which is what a backgrounded audio app is for.
        UIBackgroundModes: [audio]
        UIAppFonts: [Literata.ttf, Literata-Italic.ttf, Inter.ttf]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BIBLE_BUNDLE_ID)
        PRODUCT_NAME: Bible
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        # The framework's simulator slice is Apple Silicon only (see scripts/build-ios.sh).
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
  # Logic tests: rules with no app around them, so they run in seconds with no simulator taps.
  # The files under test are compiled straight into the bundle rather than reached through the
  # app, so there is no host app to launch and nothing here depends on the Rust framework.
  BibleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BibleTests
      - path: Bible/ReadAloud/ReadAloudState.swift
      - path: Bible/Reader/FollowTheVoice.swift
      - path: Bible/Reader/WordForm.swift
      - path: Bible/ReadAloud/VoiceOrder.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BIBLE_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
  BibleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BibleUITests
    dependencies:
      - target: Bible
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BIBLE_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Bible
        TARGETED_DEVICE_FAMILY: "1,2"
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
schemes:
  Bible:
    build:
      targets:
        Bible: all
        BibleTests: [test]
        BibleUITests: [test]
    run:
      config: Debug
      # The debug scheme always keeps the breadcrumb trail, so a freeze caught while running from
      # Xcode leaves a once-a-second record of where the reader thought it was.
      commandLineArguments:
        "--hang-log": true
    test:
      config: Release
      targets:
        - BibleTests
        - BibleUITests
    archive:
      config: Release
